name: Build APK

on:
  push:
    branches: [main]
    paths: ['xinan-app/android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (manual)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          sudo mkdir -p $ANDROID_HOME
          cd $ANDROID_HOME
          sudo wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          sudo unzip -q commandlinetools-linux-11076708_latest.zip
          sudo mkdir -p cmdline-tools/latest
          sudo sh -c 'mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/source.properties cmdline-tools/NOTICE.txt cmdline-tools/latest/ 2>/dev/null || true'
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Accept licenses and install components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        working-directory: xinan-app/android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: xinan-debug-apk
          path: xinan-app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Create Release
        if: github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        with:
          name: 心安 v0.2
          tag_name: v0.2
          body: |
            🧠 心安 - 安卓焦虑情绪助手
            - 聊天模式 (CBT疏导) | 视频模式 (微表情分析)
            - 手机号注册/登录 | 正念呼吸 | 记忆/成长报告
          files: xinan-app/android/app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: false
