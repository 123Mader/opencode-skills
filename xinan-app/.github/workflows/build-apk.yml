name: Build APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

# 复用 runner 预装 Android SDK + Gradle 缓存, 提速 2-3 倍
# 不用第三方 setup-android action (它在 runner cmdline-tools 16.0 上 exit 1), 改纯 sdkmanager
# ★ Release 发布 APK: 配合 ghproxy 加速下载到手机
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true -Dorg.gradle.parallel=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (runner 预装 + 补 license/组件)
        shell: bash
        run: |
          set -e
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          SDKMGR=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDKMGR" ]; then echo "未找到 sdkmanager"; ls "$ANDROID_HOME/cmdline-tools"; exit 1; fi
          echo "sdkmanager: $SDKMGR"
          (yes || true) | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -3 || true
          echo "platforms:"; ls "$ANDROID_HOME/platforms" 2>/dev/null
          echo "build-tools:"; ls "$ANDROID_HOME/build-tools" 2>/dev/null

      - name: Cache Gradle distribution
        uses: actions/cache@v4
        id: gradle-dist-cache
        with:
          path: /opt/gradle-8.9
          key: gradle-dist-8.9-${{ runner.os }}

      - name: Install Gradle 8.9 (AGP 8.5.2 需要 ≥ 8.7)
        if: steps.gradle-dist-cache.outputs.cache-hit != 'true'
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d /opt
          rm -f gradle-8.9-bin.zip

      - name: Add Gradle to PATH
        run: echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            android/.gradle
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/*.properties') }}
          restore-keys: gradle-deps-${{ runner.os }}-

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: xinan-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Release APK (ghproxy 友好)
        if: always() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3-build${{ github.run_number }}
          name: 心安 v0.3 build#${{ github.run_number }}
          body: |
            微表情心理预期引擎 + Material3 主题
            构建于 ${{ github.run_id }}
          files: android/app/build/outputs/apk/debug/*.apk
          prerelease: true
          generate_release_notes: false
