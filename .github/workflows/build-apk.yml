name: Build APK

on:
  push:
    branches: [main]
    paths: ['xinan-app/android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build Debug APK
        working-directory: xinan-app/android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: xinan-debug-apk
          path: xinan-app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Create Release
        if: github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        with:
          name: 心安 v0.2
          tag_name: v0.2
          body: |
            🧠 心安 - 安卓焦虑情绪助手
            - 聊天模式 (CBT疏导) | 视频模式 (微表情分析)
            - 手机号注册/登录 | 正念呼吸 | 记忆/成长报告
          files: xinan-app/android/app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: false
